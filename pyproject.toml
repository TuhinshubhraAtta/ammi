[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ammi-imputer"
version = "1.0.0"
authors = [
  { name="Tuhinshubhra Atta", email="attatuhinshubhra@gmail.com" },
]
description = "Adaptive Micro-Manifold Imputer: A fast linear-time non-parametric tabular imputation framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = ["imputation", "missing-values", "machine-learning", "tabular-data", "scikit-learn"]
dependencies = [
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
full = [
    "pandas>=1.3.0",
    "scipy>=1.7.0",
]

[project.urls]
"Homepage" = "https://github.com/TuhinshubhraAtta/ammi"
"Repository" = "https://github.com/TuhinshubhraAtta/ammi.git"
"Bug Tracker" = "https://github.com/TuhinshubhraAtta/ammi/issues"
