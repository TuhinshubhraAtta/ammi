[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ammi-imputer"
version = "1.0.0"
authors = [
  { name="AMMI Authors" },
]
description = "Adaptive Micro-Manifold Imputer: A fast linear-time O(n) non-parametric tabular imputation framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = ["imputation", "missing-values", "machine-learning", "tabular-data", "data-science"]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.20.0", "pandas>=1.3.0"]
all = ["numpy>=1.20.0", "pandas>=1.3.0", "scikit-learn>=1.0.0"]

[project.urls]
"Homepage" = "https://github.com/your-username/ammi-imputer"
"Bug Tracker" = "https://github.com/your-username/ammi-imputer/issues"
